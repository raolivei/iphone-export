name: Build and Push API Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
    paths:
      - "backend/**"
      - ".github/workflows/build-and-push-api.yml"
      - "VERSION"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/build-and-push-api.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g., v1.0.0)"
        required: false
        default: "latest"

permissions:
  # Required by raolivei/github-workflows docker-build.yml (nested job may request contents: write).
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    uses: raolivei/github-workflows/.github/workflows/docker-build.yml@main
    with:
      image-name: iphone-export-api
      context: .
      dockerfile: backend/Dockerfile
      platforms: linux/arm64
    secrets:
      REGISTRY_TOKEN: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
